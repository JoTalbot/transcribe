name: CI Smoke

on:
  push:
    branches: [main]
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-smoke-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install package
        run: python -m pip install -e .
      - name: Install test runner
        run: python -m pip install "pytest>=8,<9"
      - name: Validate repository
        run: |
          python -m json.tool notebooks/transcribe_pipeline.ipynb >/dev/null
          python -m compileall -q scripts
          test -f README.md
          test -f scripts/sync_drive.py
          test -f scripts/colab_runner.py
          echo 'CI smoke validation passed.'
      - name: Exercise Oracle-local worker
        run: python -m pytest -q tests/test_oracle_local_worker.py tests/test_oracle_local_worker_integration.py
