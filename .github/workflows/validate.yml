name: Validate

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  validate:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: transcribe
          POSTGRES_PASSWORD: transcribe
          POSTGRES_DB: transcribe_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U transcribe -d transcribe_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      TRANSCRIBE_TEST_DATABASE_URL: postgresql://transcribe:transcribe@127.0.0.1:5432/transcribe_test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.11'
      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - name: Install validation tools
        run: python -m pip install --upgrade pip && pip install -r requirements-dev.txt
      - name: Compile Python
        run: python -m compileall -q scripts src tests
      - name: Validate notebook JSON
        run: python -m json.tool notebooks/transcribe_pipeline.ipynb >/dev/null
      - name: Validate notebook structure
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          p = Path('notebooks/transcribe_pipeline.ipynb')
          nb = json.loads(p.read_text())
          assert nb['nbformat'] == 4
          assert isinstance(nb['cells'], list) and nb['cells']
          source = '\n'.join(''.join(cell.get('source', [])) for cell in nb['cells'])
          assert 'scripts/colab_exchange_worker.py' in source
          assert '--root /content/drive/MyDrive/transcribe/exchange' in source
          assert '--output /content/drive/MyDrive/transcribe/exchange/artifacts' in source
          assert 'Whisper large-v3' in source
          assert 'pyannote speaker-diarization-3.1' in source
          assert 'SpeechBrain ECAPA' in source
          print(f'Notebook valid: {len(nb["cells"])} cells; canonical exchange contract present')
          PY
      - name: Validate conversation schema
        run: python -m json.tool schemas/conversation.schema.json >/dev/null
      - name: Lint Python
        run: ruff check scripts src tests
      - name: Run tests
        timeout-minutes: 10
        run: timeout --signal=TERM --kill-after=30s 8m python -m pytest -vv -ra --timeout=45 --timeout-method=thread
      - name: Validate script entrypoints
        run: |
          python scripts/oracle_worker.py --help >/dev/null
          python scripts/colab_worker.py --help >/dev/null
          python scripts/colab_exchange_worker.py --help >/dev/null
          python scripts/colab_runner.py --help >/dev/null
          python scripts/submit_exchange_jobs.py --help >/dev/null
          python scripts/apply_exchange_results.py --help >/dev/null
      - name: Check repository structure
        run: |
          test -f README.md
          test -f requirements-sync.txt
          test -f notebooks/transcribe_pipeline.ipynb
          test -f scripts/sync_drive.py
          test -f scripts/colab_runner.py
          test -f scripts/build_manifest.py
          test -f scripts/colab_worker.py
          test -f src/transcribe_intelligence/__init__.py
          test -f src/transcribe_intelligence/text_analysis.py
          test -f schemas/conversation.schema.json
